# fly.toml app configuration file generated for asset-tracking-evan on 2026-05-17T18:40:38-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'asset-tracking-evan'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_DATA_DIR = '/app/data'
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  PORT = '8080'

[[mounts]]
  source = 'asset_data'
  destination = '/app/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '30s'
    timeout = '3s'
    grace_period = '5s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
